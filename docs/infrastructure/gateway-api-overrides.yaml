# Gateway API Overrides - Apply ON TOP of base values
# Usage: helm upgrade cilium cilium/cilium --version 1.19.3 -f docs/infrastructure/cilium-values.yaml -f docs/infrastructure/gateway-api-overrides.yaml
#
# These override the base values to enable Gateway API functionality

# Gateway API - core feature
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        role: gateway
  secretsNamespace:
    create: true
    name: cilium-secrets
    sync: true

# Required for Gateway API
envoyConfig:
  enabled: true

# Required prerequisite for Gateway API in Cilium 1.18
nodePort:
  enabled: true

# Required for Gateway API reconciliation in the current Cilium baseline
kubeProxyReplacement: true

# Fix: Envoy needs NET_BIND_SERVICE to bind ports 80/443
envoy:
  securityContext:
    capabilities:
      add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_BIND_SERVICE
      keepCapNetBindService: true
