apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-service-dashboards
  namespace: croc-shop-monitoring
  labels:
    app: grafana
data:
  croc-shop-product-catalog-service.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "index": 0, "text": "DOWN" } }, "type": "value" },
                { "options": { "1": { "color": "green", "index": 1, "text": "UP" } }, "type": "value" }
              ],
              "thresholds": { "steps": [
                { "color": "red", "value": null },
                { "color": "green", "value": 1 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "max(up{job=\"kubernetes-pods\",app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\"})",
              "legendFormat": "product-catalog",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Product Catalog Service Up",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "thresholds": { "steps": [{ "color": "green", "value": null }] }, "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(http_request_duration_seconds_count{app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\"}[5m]))",
              "legendFormat": "requests/sec",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Product Catalog Request Rate",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 0.01 }, { "color": "red", "value": 0.05 }] }, "unit": "percentunit" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(http_request_duration_seconds_count{app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\",status_code=~\"4..|5..\"}[5m])) / clamp_min(sum(rate(http_request_duration_seconds_count{app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\"}[5m])), 0.000001)",
              "legendFormat": "error rate",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Product Catalog Error Rate",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 0.5 }, { "color": "red", "value": 1 }] }, "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\"}[5m])))",
              "legendFormat": "p95",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Product Catalog P95 Latency",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": { "legend": false, "tooltip": false, "vis": false }, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": { "type": "linear" }, "showPoints": "never", "spanNulls": false, "stacking": { "group": "A", "mode": "none" }, "thresholdsStyle": { "mode": "off" } }, "thresholds": { "steps": [{ "color": "green", "value": null }] }, "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 5,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (method, route) (rate(http_request_duration_seconds_count{app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\"}[5m]))",
              "legendFormat": "{{method}} {{route}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Product Catalog Requests by Route",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": { "legend": false, "tooltip": false, "vis": false }, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": { "type": "linear" }, "showPoints": "never", "spanNulls": false, "stacking": { "group": "A", "mode": "none" }, "thresholdsStyle": { "mode": "off" } }, "thresholds": { "steps": [{ "color": "green", "value": null }] }, "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 6,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le, method, route) (rate(http_request_duration_seconds_bucket{app=\"product-catalog\",kubernetes_namespace=\"croc-shop-product-catalog\"}[5m])))",
              "legendFormat": "p95 {{method}} {{route}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Product Catalog Latency by Route",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["croc-shop", "product-catalog", "service"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Croc Shop Product Catalog Service",
      "uid": "croc-shop-product-catalog-service",
      "version": 1,
      "weekStart": ""
    }
